name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatage, types, version, eval du détecteur, bundles à jour.
      - run: npm run check
      - name: Version plus récente que la dernière publiée
        if: github.base_ref == 'main'
        run: node scripts/check-version.js --newer-than-release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dom
