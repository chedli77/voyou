name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatage, types, version, eval du détecteur, bundles à jour.
      - run: npm run check
      # Une nouvelle version n'est exigée que si l'extension elle-même change :
      # une PR qui ne touche qu'à la doc, aux tests ou à la CI n'a rien à publier.
      - name: Version plus récente que la dernière publiée
        if: github.base_ref == 'main'
        run: |
          if git diff --quiet "origin/$GITHUB_BASE_REF...HEAD" -- extension/; then
            echo "::notice::L'extension ne change pas : pas de nouvelle version à publier."
          else
            node scripts/check-version.js --newer-than-release
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dom
