<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Voyou</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1 class="popup__title" id="title">Voyou</h1>
          <p class="popup__subtitle">Filtre local sur X</p>
        </div>
        <label class="switch" title="Activer ou couper Voyou">
          <input type="checkbox" id="enabled" role="switch" aria-labelledby="title" aria-describedby="enabled-state" />
          <span class="switch__track" aria-hidden="true"></span>
          <span class="switch__thumb" aria-hidden="true"></span>
        </label>
      </header>
      <p class="popup__state" id="enabled-state" aria-live="polite"></p>

      <fieldset class="section" id="filters">
        <legend class="section__title">Masquer</legend>
        <!-- Rempli par popup.js à partir de detection/categories.js -->
      </fieldset>

      <fieldset class="section">
        <legend class="section__title">Sensibilité</legend>
        <div class="segmented" id="sensitivity"></div>
        <p class="section__hint">Stricte masque plus de messages, avec plus d'erreurs possibles.</p>
      </fieldset>

      <div class="section">
        <label class="section__title" for="allowed">Comptes autorisés</label>
        <textarea
          id="allowed"
          rows="2"
          spellcheck="false"
          autocomplete="off"
          placeholder="@ami&#10;@collegue"
          aria-describedby="allowed-hint"
        ></textarea>
        <p class="section__hint" id="allowed-hint">Un compte par ligne. Leurs posts ne sont jamais masqués.</p>
      </div>

      <p class="popup__footer">Tout reste sur ton appareil. Voyou ne signale ni ne bloque personne.</p>
    </main>
    <script type="module" src="popup.bundle.js"></script>
  </body>
</html>
